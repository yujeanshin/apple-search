[project]
name = "apple-search"
version = "0.1.0"
description = "evaluating Apple Game heuristics against random play and optimal score"
readme = "README.md"
authors = [
    { name = "Yujean Shin", email = "yujeanshin@college.harvard.edu" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
apple-search = "apple_search:main"
make-suite = "apple_search.evals.make_suite:main"
run-benchmark = "apple_search.evals.run_benchmark:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]